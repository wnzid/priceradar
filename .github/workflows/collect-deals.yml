name: Collect deals

on:
  schedule:
    - cron: "17 6,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: deal-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run collect

      - name: Commit data changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No promotional changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "wnzid"
          git config user.email "183149325+wnzid@users.noreply.github.com"

          git add data
          git commit -m "data: update supermarket deals"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deployment
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy GitHub Pages"